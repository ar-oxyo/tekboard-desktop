[package]
name = "tekboard"
version = "1.2.0"
description = "TekBoard — Epitech developer command center"
authors = ["Thibault Eininger"]
license = "GPL-3.0-only"
repository = "https://github.com/ar-oxyo/tekboard-desktop"
edition = "2021"

[lib]
name = "tekboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tree-sitter = "0.27.2"
tree-sitter-c = "0.24.2"
similar = "3.2.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
ureq = "3.5.1"
base64 = "0.23.1"
tauri-plugin-updater = "2.14.1"
semver = "1.0.28"
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-tungstenite = "0.30.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
mdns-sd = "0.22.0"
if-addrs = "0.15.0"
futures-util = "0.3.34"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
